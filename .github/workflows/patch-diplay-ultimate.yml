name: Ultimate Patch DiPlay for K2001N

on:
  push:
  workflow_dispatch:

jobs:
  ultimate-patch:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库文件
        uses: actions/checkout@v4

      - name: 2. 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 精准定位原版 DiPlay 并注入 30帧流畅 + 4倍音乐缓冲补丁
        run: |
          # 只查找名字包含 diplay (不区分大小写) 的原版安装包，绝不误抓 CarMore！
          APK_FILE=$(find . -maxdepth 2 -iname "*diplay*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ 错误：仓库里没有找到名字带 diplay 的原版安装包！请先把 DiPlay-0.2.21.apk 上传到仓库！"
            exit 1
          fi
          echo "✅ 成功锁定原版底包: $APK_FILE"
          cp "$APK_FILE" input.apk

          # 下载 Apktool
          curl -L -s https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o apktool
          curl -L -s https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o apktool.jar
          chmod +x apktool

          # 核心关键：使用 -r 参数，100% 原封不动保留原版 AndroidManifest.xml (自启动) 与资源文件，绝不闪退！
          ./apktool d -r input.apk -o decoded -f

          # 清理 64位冗余库，只保留全志T3 32位 armeabi-v7a，释放车机内存
          rm -rf decoded/lib/arm64-v8a decoded/lib/x86 decoded/lib/x86_64

          # 使用 Python 进行合法的 Smali 字节码指令级修改（彻底避免 cannot fit into a short 报错）
          python3 - << 'PYEOF'
          import os, re

          audio_patched = 0
          timeout_patched = 0
          fps_patched = 0

          for root_dir, _, files in os.walk("decoded"):
              for fname in files:
                  if not fname.endswith(".smali"):
                      continue
                  fpath = os.path.join(root_dir, fname)
                  with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()

                  orig = content

                  # 1. 【解决放音乐卡顿】找到 AudioTrack.getMinBufferSize(III)I，将返回的音频缓冲区直接扩大 4 倍 (mul-int/lit8)
                  if "Landroid/media/AudioTrack;->getMinBufferSize(III)I" in content:
                      pattern = r'(invoke-static(?:/range)?\s+\{[^}]+\},\s*Landroid/media/AudioTrack;->getMinBufferSize\(III\)I\s*\n(?:\s*\.line\s+\d+\s*\n|\s*\n)*\s*move-result\s+([vp]\d+))'
                      def repl_audio(m):
                          global audio_patched
                          audio_patched += 1
                          reg = m.group(2)
                          return f"{m.group(1)}\n    mul-int/lit8 {reg}, {reg}, 0x4"
                      content = re.sub(pattern, repl_audio, content)

                  # 2. 【解决音视频解码丢帧断流】仅在包含 MediaCodec 或 AudioTrack 的类中，将 16位超时指令合法升级为 32位 const-wide/32
                  if "Landroid/media/MediaCodec;" in content or "Landroid/media/AudioTrack;" in content:
                      def repl_timeout(m):
                          global timeout_patched
                          timeout_patched += 1
                          return f"{m.group(1)}const-wide/32 {m.group(2)}, 0x3d090"
                      content = re.sub(r'^(\s*)const-wide/16\s+([vp]\d+),\s*0x(2710|1388|fa0)\b', repl_timeout, content, flags=re.M)

                  # 3. 【锁定 30 帧流畅模式】在涉及视频帧率 (fps / frame-rate / video/avc) 的类中，将默认 60帧 (0x3c) 改为 30帧 (0x1e)
                  if any(k in content.lower() for k in ("fps", "frame-rate", "video/avc", "framerate")):
                      def repl_fps(m):
                          global fps_patched
                          fps_patched += 1
                          return f"{m.group(1)}const/16 {m.group(2)}, 0x1e"
                      content = re.sub(r'^(\s*)const/16\s+([vp]\d+),\s*0x3c\b', repl_fps, content, flags=re.M)

                  if content != orig:
                      with open(fpath, "w", encoding="utf-8") as f:
                          f.write(content)

          print(f"=== 补丁注入完成：音频4倍缓冲={audio_patched}处, 解码超时优化={timeout_patched}处, 30帧锁定={fps_patched}处 ===")
          PYEOF

          echo "=== 重新回编译 APK 并执行 V1+V2 签名 ==="
          ./apktool b decoded -o unsigned.apk

          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)

          "$ZIPALIGN" -p -f 4 unsigned.apk DiPlay-K2001N-30FPS-Smooth.apk

          keytool -genkeypair -v -keystore k2001n.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias k2001n -storepass 123456 -keypass 123456 \
            -dname "CN=K2001N, OU=CarPlay, O=Custom, L=CN, ST=CN, C=CN"

          "$APKSIGNER" sign --ks k2001n.jks --ks-key-alias k2001n \
            --ks-pass pass:123456 --key-pass pass:123456 \
            --v1-signing-enabled true --v2-signing-enabled true \
            DiPlay-K2001N-30FPS-Smooth.apk

          ls -lh DiPlay-K2001N-30FPS-Smooth.apk

      - name: 4. 上传最终修补好的原版 APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-K2001N-30FPS-Smooth-APK
          path: DiPlay-K2001N-30FPS-Smooth.apk
