name: Ultimate Patch DiPlay for K2001N

on:
  push:
  workflow_dispatch:

jobs:
  ultimate-patch:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库文件
        uses: actions/checkout@v4

      - name: 2. 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. 原版外壳无损替换 (专为 Android 7.1 车机打造，保留0压缩与035格式)
        run: |
          APK_FILE=$(find . -maxdepth 2 -iname "*diplay*.apk" | head -n 1)
          echo "✅ 锁定原版底包: $APK_FILE"
          cp "$APK_FILE" input.apk

          # 下载 Apktool
          curl -L -s https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o apktool
          curl -L -s https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o apktool.jar
          chmod +x apktool

          # 解包提取 smali 代码
          ./apktool d -r input.apk -o decoded -f

          # 【关键修复 1】强制锁定 API 21 (Android 5.0~7.1)，确保编译出的 classes.dex 为车机支持的 035 格式
          sed -i "s/minSdkVersion: .*/minSdkVersion: '21'/g" decoded/apktool.yml

          # 注入 4倍音频缓冲 + 解码超时防丢帧 + 30帧锁定
          python3 - << 'PYEOF'
          import os, re

          for root_dir, _, files in os.walk("decoded"):
              for fname in files:
                  if not fname.endswith(".smali"):
                      continue
                  fpath = os.path.join(root_dir, fname)
                  with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()
                  orig = content

                  # 1. 扩大 AudioTrack 音频硬件缓冲区 4 倍，解决放歌卡顿
                  if "Landroid/media/AudioTrack;->getMinBufferSize(III)I" in content:
                      pattern = r'(invoke-static(?:/range)?\s+\{[^}]+\},\s*Landroid/media/AudioTrack;->getMinBufferSize\(III\)I\s*\n(?:\s*\.line\s+\d+\s*\n|\s*\n)*\s*move-result\s+([vp]\d+))'
                      content = re.sub(pattern, lambda m: f"{m.group(1)}\n    mul-int/lit8 {m.group(2)}, {m.group(2)}, 0x4", content)

                  # 2. 扩大 MediaCodec / AudioTrack 解码等待窗口
                  if "Landroid/media/MediaCodec;" in content or "Landroid/media/AudioTrack;" in content:
                      content = re.sub(r'^(\s*)const-wide/16\s+([vp]\d+),\s*0x(2710|1388|fa0)\b', lambda m: f"{m.group(1)}const-wide/32 {m.group(2)}, 0x3d090", content, flags=re.M)

                  # 3. 锁定默认 30 帧流畅模式
                  if any(k in content.lower() for k in ("fps", "frame-rate", "video/avc", "framerate")):
                      content = re.sub(r'^(\s*)const/16\s+([vp]\d+),\s*0x3c\b', lambda m: f"{m.group(1)}const/16 {m.group(2)}, 0x1e", content, flags=re.M)

                  if content != orig:
                      with open(fpath, "w", encoding="utf-8") as f:
                          f.write(content)
          PYEOF

          # 先用 apktool 生成修改后的 classes*.dex
          ./apktool b decoded -o temp_dex.apk

          # 【关键修复 2】直接基于原版 input.apk 进行无损 ZIP 替换：
          # 100% 保留原版 AndroidManifest.xml 与资源，剔除 64位库，并强制 .so 库与 resources.arsc 为 0压缩 (ZIP_STORED)
          python3 - << 'PYEOF'
          import zipfile

          with zipfile.ZipFile("temp_dex.apk", "r") as z_dex:
              patched_dex = {name: z_dex.read(name) for name in z_dex.namelist() if name.startswith("classes") and name.endswith(".dex")}

          with zipfile.ZipFile("input.apk", "r") as zin, zipfile.ZipFile("raw_repacked.apk", "w") as zout:
              for item in zin.infolist():
                  name = item.filename
                  # 移除旧签名与 64位/x86 冗余库，只留 32位 armeabi-v7a
                  if name.startswith(("META-INF/", "lib/arm64-v8a/", "lib/x86/", "lib/x86_64/")):
                      continue
                  
                  info = zipfile.ZipInfo(filename=name, date_time=item.date_time)
                  info.external_attr = item.external_attr

                  if name in patched_dex:
                      info.compress_type = zipfile.ZIP_DEFLATED
                      zout.writestr(info, patched_dex[name])
                  elif name.endswith(".so") or name == "resources.arsc":
                      # 强制 0 压缩 (ZIP_STORED)，彻底解决 Android 7.1 车机拒装问题！
                      info.compress_type = zipfile.ZIP_STORED
                      zout.writestr(info, zin.read(name))
                  else:
                      info.compress_type = item.compress_type
                      zout.writestr(info, zin.read(name))
          print("✅ 原版外壳无损替换完成！")
          PYEOF

          # 4KB 边界对齐 + 强制 API 21 兼容 V1+V2 签名
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)

          "$ZIPALIGN" -p -f 4 raw_repacked.apk DiPlay-K2001N-30FPS-Smooth.apk

          keytool -genkeypair -v -keystore k2001n.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias k2001n -storepass 123456 -keypass 123456 \
            -dname "CN=K2001N, OU=CarPlay, O=Custom, L=CN, ST=CN, C=CN"

          "$APKSIGNER" sign --ks k2001n.jks --ks-key-alias k2001n \
            --ks-pass pass:123456 --key-pass pass:123456 \
            --min-sdk-version 21 \
            --v1-signing-enabled true --v2-signing-enabled true \
            DiPlay-K2001N-30FPS-Smooth.apk

      - name: 4. 上传车机专版 APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-K2001N-30FPS-Smooth-APK
          path: DiPlay-K2001N-30FPS-Smooth.apk
